<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Climbing XP</title>
</head>
<body>
    <h1>CLIMBING XP</h1>
    <p id="strt">Mój dziennik wspinaczkowy</p>
    <form id="formula">
        <label for="rName">Nazwa drogi</label>
        <input type="text" id="rName" name="rName" required>

        <fieldset>
            <legend for="rFRA">Skala Trudności</legend>
            <div class="scale-selector">
                <label class="scale-option">
                    <input type="radio" id="rFRA" name="rSt" value="fr" checked>
                        Francuska
                    </label>
                    <label class="scale-option">
                        <input type="radio" id="rKUR" name="rSt" value="kurtyka">
                        Kurtyki
                    </label>    
            </div>
        </fieldset>

        <label for="rPrice">Wycena drogi</label>
        <select id="rPrice" name="rPrice"></select>
        <fieldset>
            <legend>Sposób przejścia</legend>
            <div class="radio-option">
                <input type="radio" id="rOS" class="sposob" name="rStyle" value="OS" checked>
                <label for="rOS">OS - Onsight</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="rF" class="sposob" name="rStyle" value="Flash">
                <label for="rF">Flash</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="rRP" class="sposob" name="rStyle" value="RP">
                <label for="rRP">RP - Redpoint</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="rKK" class="sposob" name="rStyle" value="KK">
                <label for="rKK">Klasyczny</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="rTR" class="sposob" name="rStyle" value="TR">
                <label for="rTR">TR - Na Wędkę</label>
            </div>
        </fieldset>
        <button id="dPi" type="submit">Dodaj przejście</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
